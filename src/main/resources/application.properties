spring.application.name=library-management-system
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/library_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=library_user
spring.datasource.password=CHANGE_ME
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=change-this-development-secret-please-replace-123456789
app.jwt.expiration-ms=900000
app.refresh-token.expiration-days=7
app.password-reset.expiration-minutes=15

# Development only. Set false in production and provide the admin through a controlled provisioning process.
app.bootstrap-admin.enabled=false
app.bootstrap-admin.email=admin@college.local
app.bootstrap-admin.password=ChangeMe123!

# Google OAuth2. Create credentials in Google Cloud Console.
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Example callback: http://localhost:8080/login/oauth2/code/google
# Configure this exact redirect URI in Google Cloud.
